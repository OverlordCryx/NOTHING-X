<!doctype html>
<html lang="en">
<head>
    <title>Editor</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/require.js/2.3.6/require.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.33.0/min/vs/loader.min.js"></script>
    <link rel="stylesheet" href="https://cdn.fluenticon.com/icon.min.css">
    <style>
        :root {
            --bg-main: #070300;
            --bg-secondary: #1b0d00;
            --bg-panel: #120800;
            --bg-tab: #211000;
            --bg-tab-active: #3a1b00;
            --bg-tab-hover: #2d1600;
            --accent: #ff8a00;
            --accent-strong: #ffb347;
            --text: #f3f3f3;
            --muted: #b8a899;
            --border: #5a2a00;
            --font-ui: "Segoe UI", "Trebuchet MS", Tahoma, sans-serif;
            --font-mono: "Consolas", "Cascadia Mono", "Courier New", monospace;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-ui);
            background: radial-gradient(circle at 10% 0%, #2a1200 0%, var(--bg-main) 45%, #030200 100%);
            color: var(--text);
            overflow: hidden;
        }

        .app {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        .resize-handle {
            position: absolute;
            z-index: 2000;
            background: transparent;
            user-select: none;
        }

        .resize-handle.top,
        .resize-handle.bottom {
            left: 10px;
            right: 10px;
            height: 6px;
        }

        .resize-handle.left,
        .resize-handle.right {
            top: 10px;
            bottom: 10px;
            width: 6px;
        }

        .resize-handle.top { top: 0; cursor: ns-resize; }
        .resize-handle.bottom { bottom: 0; cursor: ns-resize; }
        .resize-handle.left { left: 0; cursor: ew-resize; }
        .resize-handle.right { right: 0; cursor: ew-resize; }

        .resize-handle.top-left,
        .resize-handle.top-right,
        .resize-handle.bottom-left,
        .resize-handle.bottom-right {
            width: 12px;
            height: 12px;
        }

        .resize-handle.top-left { top: 0; left: 0; cursor: nwse-resize; }
        .resize-handle.top-right { top: 0; right: 0; cursor: nesw-resize; }
        .resize-handle.bottom-left { bottom: 0; left: 0; cursor: nesw-resize; }
        .resize-handle.bottom-right { bottom: 0; right: 0; cursor: nwse-resize; }

        .window-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px;
            min-height: 36px;
            box-sizing: border-box;
            border-bottom: 1px solid var(--border);
            background: linear-gradient(180deg, #210e00 0%, #140900 100%);
            user-select: none;
        }

        .window-title {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.08em;
            color: #ffe2c0;
            font-family: var(--font-ui);
        }

        .window-title-wrap {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .window-status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 1px solid rgba(0, 0, 0, 0.45);
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.05) inset;
            background: #f2495c;
        }

        .window-status-dot.status-trying {
            background: #f2c94c;
        }

        .window-status-dot.status-attached {
            background: #ff8a00;
        }

        .window-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-direction: row-reverse;
        }

        .win-btn {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 1px solid rgba(0, 0, 0, 0.45);
            cursor: pointer;
            padding: 0;
        }

        .win-btn.close {
            background: #ff5f57;
        }

        .win-btn.max {
            background: #ffbd2e;
        }

        .win-btn.min {
            background: #28c840;
        }

        .win-btn:hover {
            filter: brightness(1.08);
        }

        .app.minimized .tabs-bar,
        .app.minimized .editor-shell {
            display: none;
        }

        .tabs-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
            border-bottom: 1px solid var(--border);
            background: linear-gradient(180deg, rgba(27, 12, 0, 0.95) 0%, rgba(10, 5, 0, 0.92) 100%);
            box-shadow: inset 0 -1px 0 rgba(255, 138, 0, 0.22);
            min-height: 46px;
            box-sizing: border-box;
            user-select: none;
        }

        .tabs-left {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1 1 auto;
            min-width: 0;
        }

        .tabs-right {
            display: flex;
            align-items: center;
            flex: 0 0 auto;
            margin-left: 8px;
        }

        #tabs {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            overflow-y: hidden;
            flex: 0 1 auto;
            max-width: calc(100% - 44px);
            min-width: 0;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        #tabs::-webkit-scrollbar {
            display: none;
        }

        .tab {
            border: 1px solid var(--border);
            background: var(--bg-tab);
            color: var(--text);
            padding: 7px 12px;
            border-radius: 8px;
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
            transition: background 0.12s linear, border-color 0.12s linear, color 0.12s linear;
            font-family: var(--font-ui);
            font-size: 13px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 7px;
        }

        .tab-icon {
            font-size: 13px;
            line-height: 1;
            opacity: 0.95;
        }

        .tab-label {
            line-height: 1;
        }

        .tab:hover {
            background: var(--bg-tab-hover);
        }

        .tab.active {
            background: var(--bg-tab-active);
            border-color: var(--accent-strong);
            color: #fff7ef;
            box-shadow: inset 0 0 0 1px rgba(255, 179, 71, 0.22);
        }

        #add-tab,
        #open-script-hub {
            border: 1px solid var(--accent);
            background: #2a1200;
            color: var(--accent-strong);
            width: 32px;
            height: 32px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 20px;
            font-weight: 700;
            font-family: var(--font-ui);
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        #add-tab:hover,
        #open-script-hub:hover {
            background: #3a1a00;
        }

        #open-script-hub {
            width: auto;
            min-width: 36px;
            padding: 0 8px;
            gap: 6px;
            font-size: 12px;
        }

        #open-script-hub .script-hub-label {
            max-width: 0;
            opacity: 0;
            overflow: hidden;
            white-space: nowrap;
            transition: max-width 0.18s ease, opacity 0.14s ease;
        }

        #open-script-hub:hover .script-hub-label,
        #open-script-hub:focus-visible .script-hub-label,
        #open-script-hub:active .script-hub-label,
        #open-script-hub.open .script-hub-label {
            max-width: 72px;
            opacity: 1;
        }

        .editor-shell {
            position: relative;
            flex: 1;
            min-height: 0;
        }

        #monaco-editor {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 0;
            overflow: hidden;
        }

        .script-hub-panel {
            position: absolute;
            right: 0;
            width: min(620px, calc(100vw - 10px));
            left: auto;
            top: 82px;
            bottom: 0;
            background: linear-gradient(180deg, #1a0b00 0%, #110700 100%);
            border: 1px solid var(--border);
            border-bottom: none;
            border-right: none;
            border-top-left-radius: 10px;
            box-shadow: -10px 0 26px rgba(0, 0, 0, 0.45);
            z-index: 30;
            display: none;
            flex-direction: column;
        }

        .script-hub-resizer {
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            width: 8px;
            cursor: ew-resize;
            background: linear-gradient(90deg, rgba(255, 138, 0, 0.35), transparent);
            z-index: 5;
        }

        .script-hub-panel.open {
            display: flex;
        }

        .script-hub-top {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
            border-bottom: 1px solid rgba(255, 138, 0, 0.2);
            background: rgba(255, 138, 0, 0.05);
        }

        #script-hub-search {
            flex: 1;
            min-width: 120px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #211000;
            color: #fff;
            height: 30px;
            padding: 0 10px;
            font-family: var(--font-ui);
            outline: none;
        }

        #script-hub-search:focus {
            border-color: var(--accent);
        }

        .script-hub-btn {
            border: 1px solid var(--border);
            background: #2a1200;
            color: var(--text);
            border-radius: 8px;
            height: 30px;
            padding: 0 9px;
            cursor: pointer;
            font-family: var(--font-ui);
            font-size: 12px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .script-hub-btn:hover {
            background: #3a1a00;
        }

        #script-hub-load {
            border-color: var(--accent);
            color: var(--accent-strong);
        }

        .script-hub-status {
            padding: 6px 10px;
            font-size: 12px;
            color: var(--muted);
            border-bottom: 1px solid rgba(255, 138, 0, 0.1);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .script-hub-list {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 8px 10px 10px 8px;
            scrollbar-width: auto;
            scrollbar-color: #ff8a00 #1b0b00;
        }

        .script-hub-list::-webkit-scrollbar {
            width: 14px;
            height: 18px;
        }

        .script-hub-list::-webkit-scrollbar-track {
            background: #1b0b00;
            border-radius: 10px;
        }

        .script-hub-list::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #ffb347 0%, #ff8a00 100%);
            border: 1px solid #1b0b00;
            border-radius: 12px;
        }

        .script-hub-list::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, #ffc36d 0%, #ff980f 100%);
        }

        .script-hub-cards {
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 8px;
        }

        .script-hub-more-row {
            display: flex;
            justify-content: center;
            align-items: center;
            padding-top: 10px;
        }

        .script-card {
            border: 1px solid var(--border);
            border-radius: 10px;
            background: #1d0e00;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: 168px;
            width: 280px;
            flex: 0 0 280px;
        }

        .script-cover-wrap {
            position: relative;
            width: 100%;
            height: 147px;
            border-bottom: 1px solid rgba(255, 138, 0, 0.12);
            overflow: hidden;
            background: #271200;
        }

        .script-cover {
            height: 147px;
            width: 100%;
            object-fit: cover;
            background: #271200;
        }

        .script-cover-fallback {
            position: absolute;
            inset: 0;
            height: 147px;
            display: none;
            align-items: center;
            justify-content: center;
            color: #ffbf73;
            background: linear-gradient(135deg, #2b1300 0%, #1b0b00 100%);
            font-size: 12px;
            letter-spacing: 0.08em;
            font-weight: 700;
        }

        .script-cover-views {
            position: absolute;
            right: 8px;
            bottom: 8px;
            border: 1px solid rgba(255, 179, 71, 0.6);
            border-radius: 999px;
            padding: 2px 8px;
            background: rgba(0, 0, 0, 0.65);
            color: #ffe3c3;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.02em;
            pointer-events: none;
        }

        .script-body {
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 7px;
            flex: 1;
        }

        .script-title {
            color: #fff3e2;
            font-size: 12px;
            font-weight: 700;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            min-height: 3.9em;
        }

        .script-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            font-size: 11px;
        }

        .tag {
            border-radius: 999px;
            padding: 2px 7px;
            border: 1px solid var(--border);
            background: #2a1200;
            color: #ffcb8d;
        }

        .tag.paid {
            border-color: #c54a4a;
            color: #ff9a9a;
            background: rgba(197, 74, 74, 0.12);
        }

        .tag.key {
            border-color: #d1a53c;
            color: #ffd977;
            background: rgba(209, 165, 60, 0.14);
        }

        .script-actions {
            margin-top: auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            overflow: visible;
            padding-bottom: 1px;
            opacity: 1;
            transform: none;
            pointer-events: auto;
        }

        .script-actions .script-action-btn:last-child {
            grid-column: 1 / -1;
        }

        .script-action-btn {
            border: 1px solid var(--border);
            background: #2b1300;
            color: var(--text);
            border-radius: 7px;
            height: 28px;
            padding: 0 8px;
            cursor: pointer;
            font-size: 11px;
            font-family: var(--font-ui);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            flex: 0 0 auto;
            width: 100%;
        }

        .script-action-btn:hover {
            background: #3b1b00;
        }

        .script-action-btn.execute {
            border-color: var(--accent);
            color: var(--accent-strong);
        }

        #script-hub-more {
            border-color: var(--accent);
            color: var(--accent-strong);
        }

        @media (max-width: 900px) {
            .script-hub-panel {
                right: 0;
                width: min(100vw, 430px);
            }
        }


        .context-menu {
            position: fixed;
            z-index: 1000;
            min-width: 140px;
            background: #1a0b00;
            border: 1px solid var(--border);
            border-radius: 8px;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.55);
            display: none;
            padding: 4px;
        }

        .menu-item {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text);
            text-align: left;
            padding: 8px 10px;
            cursor: pointer;
            border-radius: 6px;
            font-family: var(--font-ui);
            font-size: 13px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .menu-item:hover {
            background: var(--bg-tab-hover);
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1100;
        }

        .modal-card {
            width: min(360px, calc(100vw - 24px));
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            box-shadow: 0 14px 34px rgba(0, 0, 0, 0.5);
            padding: 14px;
        }

        .modal-title {
            text-align: center;
            font-size: 16px;
            font-weight: 700;
            margin: 0 0 10px;
            color: #fff;
        }

        #tab-name-input {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #1e1000;
            color: #fff;
            padding: 9px 10px;
            font-family: var(--font-ui);
            font-size: 14px;
            outline: none;
            margin-bottom: 10px;
        }

        #tab-name-input:focus {
            border-color: var(--accent);
        }

        .modal-actions {
            display: flex;
            justify-content: center;
            gap: 8px;
        }

        .modal-btn {
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #251100;
            color: var(--text);
            padding: 8px 12px;
            font-family: var(--font-ui);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-icon {
            display: inline-block;
            width: 14px;
            text-align: center;
            line-height: 1;
            opacity: 0.95;
        }

        .btn-icon[class*="vr-"],
        .tab-icon[class*="vr-"] {
            width: auto;
            font-size: 14px;
        }

        .modal-btn.primary {
            border-color: var(--accent);
            color: var(--accent);
        }

        .modal-btn:hover {
            background: #2a1400;
        }

        .toast-wrap {
            position: fixed;
            right: 12px;
            bottom: 12px;
            z-index: 1200;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: min(320px, calc(100vw - 24px));
            pointer-events: none;
        }

        .toast {
            border: 1px solid #7a3900;
            border-left: 4px solid var(--accent-strong);
            background: linear-gradient(180deg, #281200 0%, #1a0d00 100%);
            color: #fff2e2;
            border-radius: 10px;
            padding: 9px 11px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.01em;
            font-family: var(--font-ui);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.45);
        }
    </style>
</head>
<body>
<div class="app">
    <div class="resize-handle top" data-resize-dir="top"></div>
    <div class="resize-handle right" data-resize-dir="right"></div>
    <div class="resize-handle bottom" data-resize-dir="bottom"></div>
    <div class="resize-handle left" data-resize-dir="left"></div>
    <div class="resize-handle top-left" data-resize-dir="top-left"></div>
    <div class="resize-handle top-right" data-resize-dir="top-right"></div>
    <div class="resize-handle bottom-left" data-resize-dir="bottom-left"></div>
    <div class="resize-handle bottom-right" data-resize-dir="bottom-right"></div>
    <div class="window-bar">
        <div class="window-title-wrap">
            <div class="window-title">NOTHING X</div>
            <div id="window-status-dot" class="window-status-dot" title="Status"></div>
        </div>
        <div class="window-controls">
            <button id="win-close" class="win-btn close" type="button" title="Close"></button>
            <button id="win-max" class="win-btn max" type="button" title="Maximize / Normal"></button>
            <button id="win-min" class="win-btn min" type="button" title="Minimize"></button>
        </div>
    </div>
    <div class="tabs-bar">
        <div class="tabs-left">
            <div id="tabs"></div>
            <button id="add-tab" type="button" title="Add tab" aria-label="Add tab"><i class="btn-icon vr-ic_fluent_add_20_regular"></i></button>
        </div>
        <div class="tabs-right">
            <button id="open-script-hub" type="button" title="Open script window" aria-label="Open script window"><i class="btn-icon vr-ic_fluent_window_new_20_regular"></i><span class="script-hub-label">Scripts</span></button>
        </div>
    </div>
    <div class="editor-shell">
        <div id="monaco-editor"></div>
    </div>
    <div id="script-hub-panel" class="script-hub-panel">
        <div id="script-hub-resizer" class="script-hub-resizer" aria-hidden="true"></div>
        <div class="script-hub-top">
            <input id="script-hub-search" type="text" placeholder="Find Script" autocomplete="off" />
            <button id="script-hub-load" class="script-hub-btn" type="button"><i class="vr-ic_fluent_search_20_regular"></i><span>Find</span></button>
        </div>
        <div id="script-hub-status" class="script-hub-status">Ready.</div>
        <div id="script-hub-list" class="script-hub-list">
            <div id="script-hub-cards" class="script-hub-cards"></div>
            <div id="script-hub-more-row" class="script-hub-more-row">
                <button id="script-hub-more" class="script-hub-btn" type="button"><i class="vr-ic_fluent_arrow_download_20_regular"></i><span>Load More</span></button>
            </div>
        </div>
</div>
</div>

<div id="tab-context-menu" class="context-menu">
    <button id="rename-tab" class="menu-item" type="button"><i class="btn-icon vr-ic_fluent_rename_20_regular"></i><span>Rename</span></button>
    <button id="delete-tab" class="menu-item" type="button"><i class="btn-icon vr-ic_fluent_delete_20_regular"></i><span>Delete</span></button>
</div>

<div id="editor-context-menu" class="context-menu">
    <button id="execute-tab" class="menu-item" type="button"><i class="btn-icon vr-ic_fluent_play_20_regular"></i><span>Execute</span></button>
    <button id="clear-tab" class="menu-item" type="button"><i class="btn-icon vr-ic_fluent_dismiss_20_regular"></i><span>Clear</span></button>
    <button id="attach-tab" class="menu-item" type="button"><i class="btn-icon vr-ic_fluent_attach_20_regular"></i><span>Attach</span></button>
</div>

<div id="tab-modal-overlay" class="modal-overlay">
    <div class="modal-card">
        <h3 id="tab-modal-title" class="modal-title">New Tab</h3>
        <input id="tab-name-input" type="text" autocomplete="off" />
        <div class="modal-actions">
            <button id="tab-modal-submit" class="modal-btn primary" type="button"><i class="btn-icon vr-ic_fluent_add_20_regular"></i><span>Create</span></button>
            <button id="tab-modal-cancel" class="modal-btn" type="button"><i class="btn-icon vr-ic_fluent_dismiss_20_regular"></i><span>Cancel</span></button>
        </div>
    </div>
</div>

<div id="toast-wrap" class="toast-wrap"></div>

<script>
    let editor;
    const STORAGE_KEY = 'monaco-tabs-v1';
    const tabsContainer = document.getElementById('tabs');
    const addTabButton = document.getElementById('add-tab');

    function generateId() {

    function tabNameExists(name, ignoreId = null) {

    function normalizeTabHistory(tab) {
        if (!Array.isArray(tab.history)) {
            tab.history = [typeof tab.content === 'string' ? tab.content : ''];
        }

        tab.history = tab.history.filter(entry => typeof entry === 'string');
        if (tab.history.length === 0) {
            tab.history = [typeof tab.content === 'string' ? tab.content : ''];
        }

        if (!Number.isInteger(tab.historyIndex)) {
            tab.historyIndex = tab.history.length - 1;
        }

        tab.historyIndex = Math.max(0, Math.min(tab.historyIndex, tab.history.length - 1));
        tab.content = tab.history[tab.historyIndex];
    }

    function pushHistorySnapshot(tab, value) {
        normalizeTabHistory(tab);
        if (tab.history[tab.historyIndex] === value) {
            tab.content = value;
            return;
        }

        tab.history = tab.history.slice(0, tab.historyIndex + 1);
        tab.history.push(value);

        if (tab.history.length > MAX_HISTORY_ENTRIES) {
            const cut = tab.history.length - MAX_HISTORY_ENTRIES;
            tab.history.splice(0, cut);
        }

        tab.historyIndex = tab.history.length - 1;
        tab.content = value;
    }

    function getActiveTab() {
        return tabs.find(tab => tab.id === activeTabId) || null;
    }

    function commitActiveHistoryCheckpoint() {
        const activeTab = getActiveTab();
        if (!activeTab || !editor) {
            return;
        }

        pushHistorySnapshot(activeTab, sanitizeScriptText(editor.getValue()));
    }

    function scheduleHistoryCheckpoint() {
        clearTimeout(historyCheckpointTimer);
        historyCheckpointTimer = setTimeout(() => {

        if (editor) {
            const activeTab = getActiveTab();
            if (activeTab) {
                const value = sanitizeScriptText(editor.getValue());
                activeTab.content = value;
                pushHistorySnapshot(activeTab, value);
            }
        }

        tabs.forEach((tab) => {
            if (!tab) {

            tab.content = sanitizeScriptText(typeof tab.content === 'string' ? tab.content : '');
            normalizeTabHistory(tab);

        saveState();

    function undoActiveTab() {

        clearTimeout(historyCheckpointTimer);
        commitActiveHistoryCheckpoint();
        normalizeTabHistory(activeTab);
        if (activeTab.historyIndex === 0) {

        }

        activeTab.historyIndex -= 1;
        const value = activeTab.history[activeTab.historyIndex];
        setEditorValueSilently(value);
        activeTab.content = value;
        saveState();

    function redoActiveTab() {
        const activeTab = getActiveTab();
        if (!activeTab || !editor) {
            return;
        }

        clearTimeout(historyCheckpointTimer);
        commitActiveHistoryCheckpoint();
        normalizeTabHistory(activeTab);
        if (activeTab.historyIndex >= activeTab.history.length - 1) {
            return;
        }

        activeTab.historyIndex += 1;
        const value = activeTab.history[activeTab.historyIndex];
        setEditorValueSilently(value);
        activeTab.content = value;
        saveState();

    function encodeBase64Utf8(text) {

    function sendHostCommand(action, payload = {}) {
        const command = JSON.stringify({ action, ...payload });
        if (window.chrome && window.chrome.webview) {
            window.chrome.webview.postMessage(command);
            return true;
        }

        if (Object.keys(payload).length > 0) {
            return false;
        }

        fetch('/request', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action })
        }).catch(() => {});

        return true;
    }

    function handleHostMessage(raw) {
        if (!raw || typeof raw !== 'string') {
            return;
        }

        let data = null;
        try {
            data = JSON.parse(raw);
        } catch (_) {
            return;
        }

        if (!data || data.type !== 'velocityStatus') {
            return;
        }

        const incomingStatus = typeof data.status === 'string' ? data.status : 'NotAttached';
        const status = incomingStatus === 'Attached' || incomingStatus === 'Attaching' ? incomingStatus : 'NotAttached';
        const message = typeof data.message === 'string' ? data.message : '';
        const shouldToast = Boolean(data.toast);

        setWindowAttachStatus(status);
        if (message && shouldToast) {
            showToast(message);
        }
    }

    function extractSearchTokens(value, output) {
        if (value === null || value === undefined) {
            return;
        }
        if (Array.isArray(value)) {
            value.forEach((entry) => extractSearchTokens(entry, output));
            return;
        }
        const valueType = typeof value;
        if (valueType === 'string' || valueType === 'number' || valueType === 'boolean') {
            const token = String(value).trim();
            if (token) {
                output.push(token);
            }
            return;
        }
        if (valueType === 'object') {
            Object.values(value).forEach((entry) => extractSearchTokens(entry, output));
        }
    }

    function normalizeSearchTokens(value) {
        const output = [];
        extractSearchTokens(value, output);
        return output.join(' ');
    }

    function collectTagStrings(value, output) {
        if (value === null || value === undefined) {
            return;
        }
        if (Array.isArray(value)) {
            value.forEach((entry) => collectTagStrings(entry, output));
            return;
        }
        const valueType = typeof value;
        if (valueType === 'string') {
            const raw = value.trim();
            if (!raw) {
                return;
            }
            raw.split(/[,|/]/).forEach((part) => {
                const cleaned = part.trim();
                if (cleaned) {
                    output.push(cleaned);
                }
            });
            return;
        }
        if (valueType === 'number' || valueType === 'boolean') {
            output.push(String(value));
            return;
        }
        if (valueType === 'object') {
            const preferred = ['name', 'title', 'tag', 'label', 'text', 'value'];
            for (const key of preferred) {
                if (key in value) {
                    collectTagStrings(value[key], output);
                }
            }
            Object.values(value).forEach((entry) => collectTagStrings(entry, output));
        }
    }

    function buildTagList(parts, limit = 6) {
        const raw = [];
        parts.forEach((part) => collectTagStrings(part, raw));
        const unique = [];
        const seen = new Set();
        raw.forEach((tag) => {
            const normalized = String(tag || '').trim();
            if (!normalized) {
                return;
            }
            const key = normalized.toLowerCase();
            if (seen.has(key)) {
                return;
            }
            seen.add(key);
            unique.push(normalized);
        });
        return unique.slice(0, limit);
    }

    function buildSearchText(parts) {
        return parts
            .map((part) => normalizeSearchTokens(part))
            .filter(Boolean)
            .join(' ')
            .toLowerCase();
    }

    function matchesScriptSearch(item, query) {
        const searchTerm = String(query || '').trim().toLowerCase();
        if (!searchTerm) {
            return true;

        if (String(item.searchGameText || '').includes(searchTerm)) {
            return true;
        }
        return String(item.searchTitleTagsText || '').includes(searchTerm);
    }

    function normalizeApiQuery(value) {
        const raw = String(value || '').trim();
        if (!raw) {
            return '';
        }
        return raw.startsWith('#') ? raw.slice(1).trim() : raw;
    }

    function normalizeWebUrl(url, source) {
        if (!url || typeof url !== 'string') {
            return '';
        }
        const value = url.trim();
        if (!value) {
            return '';
        }
        if (value.startsWith('http://') || value.startsWith('https://')) {
            return value;
        }
        if (value.startsWith('//')) {
            return `https:${value}`;
        }
        if (value.startsWith('/')) {
            if (source === 'scriptblox') {
                return `https://scriptblox.com${value}`;
            }
            if (source === 'rscripts') {
                return `https://rscripts.net${value}`;
            }
        }
        return '';
    }

    function extractUrlCandidate(value, source) {
        if (!value) {
            return '';
        }
        if (typeof value === 'string') {
            return normalizeWebUrl(value, source);
        }
        if (Array.isArray(value)) {
            for (let i = 0; i < value.length; i += 1) {
                const candidate = extractUrlCandidate(value[i], source);
                if (candidate) {
                    return candidate;
                }
            }
            return '';
        }
        if (typeof value === 'object') {
            const keys = ['url', 'href', 'link', 'keyUrl', 'keyURL', 'keyLink', 'bypass', 'destination'];
            for (let i = 0; i < keys.length; i += 1) {
                if (keys[i] in value) {
                    const candidate = extractUrlCandidate(value[keys[i]], source);
                    if (candidate) {
                        return candidate;
                    }
                }
            }
        }
        return '';
    }

    function resolveFirstUrl(source) {
        for (let i = 1; i < arguments.length; i += 1) {
            const candidate = extractUrlCandidate(arguments[i], source);
            if (candidate) {
                return candidate;
            }
        }
        return '';
    }

    function parseScriptTimestamp() {
        for (let i = 0; i < arguments.length; i += 1) {
            const value = arguments[i];
            if (value === null || value === undefined || value === '') {
                continue;
            }
            const timestamp = Date.parse(String(value));
            if (Number.isFinite(timestamp)) {
                return timestamp;
            }
        }
        return null;
    }

    function formatScriptViews(value) {
        const number = Number(value);
        if (!Number.isFinite(number) || number <= 0) {
            return '0 views';
        }
        return `${new Intl.NumberFormat('en-US', { notation: 'compact', maximumFractionDigits: 1 }).format(number)} views`;
    }

    function formatCreatedAgo(timestamp) {
        if (!Number.isFinite(timestamp)) {
            return 'created unknown';
        }

        const diffMs = Math.max(0, Date.now() - timestamp);
        const minute = 60 * 1000;
        const hour = 60 * minute;
        const day = 24 * hour;
        const month = 30 * day;

        if (diffMs < hour) {
            const minutes = Math.max(1, Math.floor(diffMs / minute));
            return `created ${minutes} min ago`;
        }
        if (diffMs < day) {
            const hours = Math.max(1, Math.floor(diffMs / hour));
            return `created ${hours}h ago`;
        }
        if (diffMs < month) {
            const days = Math.max(1, Math.floor(diffMs / day));
            return `created ${days}d ago`;
        }

        const months = Math.max(1, Math.floor(diffMs / month));
        return `created ${months} month${months === 1 ? '' : 's'} ago`;
    }

    function parseReactionCount() {
        for (let i = 0; i < arguments.length; i += 1) {
            const raw = arguments[i];
            if (raw === null || raw === undefined || raw === '') {
                continue;
            }
            const number = Number(raw);
            if (Number.isFinite(number) && number >= 0) {
                return number;
            }
        }
        return 0;
    }

    function formatCompactNumber(value) {
        const number = Number(value);
        if (!Number.isFinite(number) || number <= 0) {
            return '0';
        }
        return new Intl.NumberFormat('en-US', { notation: 'compact', maximumFractionDigits: 1 }).format(number);
    }

    function formatLikesDislikes(likes, dislikes) {
        return `${formatCompactNumber(likes)} | ${formatCompactNumber(dislikes)}`;
    }

            ])
        };
    }

    function sleep(ms) {
        return new Promise((resolve) => setTimeout(resolve, ms));
    }

    async function fetchJsonWithRetry(url, retries = 8) {
        let attempt = 0;
        while (true) {
            const response = await fetch(url);
            if (response.ok) {
                const text = await response.text();
                try {
                    return JSON.parse(text);
                } catch (err) {
                    throw new Error('Invalid JSON response');
                }
            }

            if (response.status === 429 && attempt < retries) {
                const retryAfterRaw = response.headers.get('Retry-After');
                const retryAfterSec = Number(retryAfterRaw);
                const retryWaitMs = Number.isFinite(retryAfterSec) && retryAfterSec > 0
                    ? retryAfterSec * 1000
                    : (1600 * (attempt + 1)) + Math.floor(Math.random() * 500);
                await sleep(retryWaitMs);
                attempt += 1;
                continue;
            }

            throw new Error(`Request failed (${response.status})`);
        }
    }

    async function fetchJsonWithCorsFallback(url) {
        const endpoints = [
            url,
            `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
            `https://corsproxy.io/?${encodeURIComponent(url)}`
        ];

        let lastError = null;
        for (const endpoint of endpoints) {
            try {
                return await fetchJsonWithRetry(endpoint, endpoint === url ? 8 : 3);
            } catch (err) {
                lastError = err;
            }
        }

        throw lastError || new Error('Failed to fetch JSON');
    }

    async function fetchScriptBloxPage(query, page) {
        const normalizedQuery = normalizeApiQuery(query);
        const effectiveQuery = normalizedQuery || 'script';
        const endpoint = `https://scriptblox.com/api/script/search?q=${encodeURIComponent(effectiveQuery)}&max=20&page=${page}`;
        const payload = await fetchJsonWithCorsFallback(endpoint);

        const result = payload && payload.result ? payload.result : {};
        const scripts = Array.isArray(result.scripts) ? result.scripts : [];
        const currentPage = Number.isInteger(result.currentPage) ? result.currentPage : page;
        const computedNextPage = Number.isInteger(result.totalPages) && currentPage < result.totalPages
            ? currentPage + 1
            : null;

        return {
            items: scripts.map(mapScriptBloxScript),
            nextPage: result.nextPage || computedNextPage
        };
    }

    async function fetchRscriptsPage(query, page) {
        const normalizedQuery = normalizeApiQuery(query);
        const endpoint = `https://rscripts.net/api/v2/scripts?page=${page}&orderBy=date&sort=desc&q=${encodeURIComponent(normalizedQuery)}`;
        const payload = await fetchJsonWithCorsFallback(endpoint);
        const scripts = Array.isArray(payload.scripts) ? payload.scripts : [];
        const maxPages = payload.info && Number.isInteger(payload.info.maxPages) ? payload.info.maxPages : page;
        return {
            items: scripts.map(mapRscriptsScript),
            nextPage: page < maxPages ? page + 1 : null
        };
    }

    function renderScriptHub(items) {
        scriptHubCards.innerHTML = '';
        if (!items || items.length === 0) {
            setScriptHubStatus('Loaded 0 scripts.');
            return;
        }

        const fragment = document.createDocumentFragment();
        items.forEach((item) => {
            fragment.appendChild(createScriptCard(item));
        });
        scriptHubCards.appendChild(fragment);
        setScriptHubStatus(`Loaded ${items.length} scripts.`);
    }

    function appendScriptHubItems(items) {
        if (!items || items.length === 0) {
            return 0;
        }

        const fragment = document.createDocumentFragment();
        let added = 0;
        items.forEach((item) => {
            const key = `${item.source}|${item.id}|${item.title}`;
            if (scriptHubSeenKeys.has(key)) {
                return;
            }
            scriptHubSeenKeys.add(key);
            scriptHubItems.push(item);
            fragment.appendChild(createScriptCard(item));
            added += 1;
        });

        if (added > 0) {
            scriptHubCards.appendChild(fragment);
            scriptHubList.appendChild(scriptHubMoreRow);
        }
        return added;
    }

    async function getScriptBody(item) {
        if (item.script && item.script.trim()) {
            item.script = sanitizeScriptText(item.script);
            return item.script;
        }
        if (!item.scriptUrl) {
            return '';
        }

        const response = await fetch(item.scriptUrl);
        if (!response.ok) {
            throw new Error('Unable to load script content');
        }
        const text = sanitizeScriptText(await response.text());
        item.script = text || '';
        return item.script;
    }

    function uniqueScriptTabName(baseName) {
        let cleaned = sanitizeName(baseName) || 'script';
        if (cleaned.length < 3) {
            cleaned = `${cleaned}___`.slice(0, 3);
        }

        let name = cleaned;
        let index = 2;
        while (tabNameExists(name)) {
            name = `${cleaned}-${index}`;
            index += 1;
        }
        return name;
    }

    async function executeScriptItem(item) {
        try {
            const scriptBody = await getScriptBody(item);
            if (!scriptBody) {
                showToast('Script body is empty.');
                return;
            }

            const scriptBase64 = encodeBase64Utf8(scriptBody);
            if (!scriptBase64) {
                showToast('Encoding failed.');
                return;
            }

            const sent = sendHostCommand('execute', { scriptBase64 });
            if (!sent) {
                showToast('Execute is available only in app mode.');
                return;
            }

        } catch (err) {
            showToast('Failed to execute script.');
        }
    }

    async function openScriptInNewTab(item) {
        try {
            const scriptBody = await getScriptBody(item);
            if (!scriptBody) {
                showToast('Script body is empty.');
                return;
            }

            clearTimeout(historyCheckpointTimer);
            commitActiveHistoryCheckpoint();
            const titleName = sanitizeName(item && item.title ? item.title : '') || 'script';
            const tabName = uniqueScriptTabName(titleName.slice(0, 28));
            const newTab = {
                id: generateId(),
                name: tabName,
                content: scriptBody,
                history: [scriptBody],
                historyIndex: 0
            };

            tabs.push(newTab);
            activeTabId = newTab.id;
            setEditorValueSilently(scriptBody);
            renderTabs();
            saveState();
        } catch (err) {
            showToast('Failed to open script tab.');
        }
    }

    async function copyTextToClipboard(text) {
        if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(text);
            return;
        }

        const temp = document.createElement('textarea');
        temp.value = text;
        temp.style.position = 'fixed';
        temp.style.left = '-9999px';
        document.body.appendChild(temp);
        temp.focus();
        temp.select();
        document.execCommand('copy');
        temp.remove();
    }

    async function copyScriptItem(item) {
        try {
            const scriptBody = await getScriptBody(item);
            if (!scriptBody) {
                showToast('Script body is empty.');
                return;
            }

            await copyTextToClipboard(scriptBody);
            showToast('Script copied.');
        } catch (err) {
            showToast('Copy failed.');
        }
    }

    async function loadAllScripts() {
        scriptHubQuery = sanitizeName(scriptHubSearch.value);
        scriptHubScriptBloxPage = 1;
        scriptHubRscriptsPage = 1;
        scriptHubItems = [];
        scriptHubSeenKeys = new Set();

        setScriptHubStatus(`Loaded ${scriptHubItems.length} scripts.`);
        scriptHubLoadButton.disabled = true;
        scriptHubCards.innerHTML = '';
        scriptHubLoadButton.disabled = false;
        await loadMoreScripts();

    function updateLoadMoreVisibility() {
        const hasMore = scriptHubScriptBloxPage !== null || scriptHubRscriptsPage !== null;
        scriptHubMoreRow.style.display = hasMore ? 'flex' : 'none';
        scriptHubMoreButton.style.display = 'inline-flex';
        scriptHubMoreButton.disabled = !hasMore || isScriptHubLoadingMore;
        scriptHubMoreButton.innerHTML = hasMore
            ? '<i class="vr-ic_fluent_arrow_download_20_regular"></i><span>Load More</span>'
            : '<i class="vr-ic_fluent_checkmark_20_regular"></i><span>No More</span>';
    }

    async function loadMoreScripts() {
        if (isScriptHubLoadingMore) {
            return;
        }
        const hasMore = scriptHubScriptBloxPage !== null || scriptHubRscriptsPage !== null;
        if (!hasMore) {
            updateLoadMoreVisibility();
            return;
        }

        isScriptHubLoadingMore = true;
        updateLoadMoreVisibility();

        const scriptBloxQuery = scriptHubQuery || '';
        if (scriptHubScriptBloxPage !== null) {
            try {
                const batch = await fetchScriptBloxPage(scriptBloxQuery, scriptHubScriptBloxPage);
                appendScriptHubItems(batch.items);
                scriptHubScriptBloxPage = batch.nextPage;
            } catch (err) {
                // Keep the page index so user can retry with "Load More".
            }
        }

        if (scriptHubRscriptsPage !== null) {
            try {
                const batch = await fetchRscriptsPage(scriptHubQuery, scriptHubRscriptsPage);
                appendScriptHubItems(batch.items);
                scriptHubRscriptsPage = batch.nextPage;
            } catch (err) {
                scriptHubRscriptsPage = null;
            }
        }

        setScriptHubStatus(`Loaded ${scriptHubItems.length} scripts.`);

        isScriptHubLoadingMore = false;
        updateLoadMoreVisibility();
    }

    function toggleScriptHub(forceOpen = null) {
        const shouldOpen = forceOpen === null ? !scriptHubPanel.classList.contains('open') : Boolean(forceOpen);
        scriptHubPanel.classList.toggle('open', shouldOpen);
        openScriptHubButton.classList.toggle('open', shouldOpen);
        openScriptHubButton.style.borderColor = shouldOpen ? 'var(--accent-strong)' : 'var(--accent)';

        if (shouldOpen && scriptHubItems.length === 0) {
            loadAllScripts();
        }
        if (shouldOpen) {
            const ratioRaw = Number(localStorage.getItem(SCRIPT_HUB_WIDTH_RATIO_KEY));
            if (Number.isFinite(ratioRaw) && ratioRaw > 0) {
                setScriptHubWidth(window.innerWidth * ratioRaw, false);
            } else {
                const width = scriptHubPanel.getBoundingClientRect().width || getScriptHubDefaultWidth();
                setScriptHubWidth(width, false);
            }
            updateLoadMoreVisibility();
        }
    }

    function getScriptHubMinWidth() {
        return SCRIPT_CARD_WIDTH + SCRIPT_HUB_SCROLLBAR_WIDTH + 28;
    }

    function getScriptHubMaxWidth() {
        return Math.max(getScriptHubMinWidth(), window.innerWidth - 40);
    }

    function getScriptHubDefaultWidth() {
        const twoCardsWidth = (SCRIPT_CARD_WIDTH * 2) + SCRIPT_HUB_CARD_GAP + 8 + SCRIPT_HUB_RIGHT_PADDING + SCRIPT_HUB_SCROLLBAR_WIDTH + 20;
        const viewportTarget = Math.round(window.innerWidth * 0.56);
        return Math.max(getScriptHubMinWidth(), Math.min(getScriptHubMaxWidth(), Math.max(twoCardsWidth, viewportTarget)));
    }

    function setScriptHubWidth(width, persist = true) {
        const safe = Math.min(getScriptHubMaxWidth(), Math.max(getScriptHubMinWidth(), Math.round(width)));
        scriptHubPanel.style.width = `${safe}px`;
        if (persist) {
            localStorage.setItem(SCRIPT_HUB_WIDTH_KEY, String(safe));
            localStorage.setItem(SCRIPT_HUB_WIDTH_RATIO_KEY, String((safe / Math.max(1, window.innerWidth)).toFixed(6)));
        }
    }

    function initializeScriptHubWidth() {
        const defaultWidth = getScriptHubDefaultWidth();
        const ratioRaw = Number(localStorage.getItem(SCRIPT_HUB_WIDTH_RATIO_KEY));
        if (Number.isFinite(ratioRaw) && ratioRaw > 0) {
            const fromRatio = window.innerWidth * ratioRaw;
            setScriptHubWidth(Math.max(defaultWidth, fromRatio), false);
            return;
        }

        const raw = localStorage.getItem(SCRIPT_HUB_WIDTH_KEY);
        const parsed = Number(raw);
        if (Number.isFinite(parsed) && parsed > 0) {
            setScriptHubWidth(Math.max(defaultWidth, parsed), false);
            return;
        }

        setScriptHubWidth(defaultWidth, false);
    }

    function saveState() {
        if (!activeTabId) {
            return;
        }

        try {
            const activeTab = tabs.find(tab => tab.id === activeTabId);
            if (activeTab && editor) {
                activeTab.content = sanitizeScriptText(editor.getValue());
            }

            localStorage.setItem(STORAGE_KEY, JSON.stringify({ tabs, activeTabId }));
        } catch (err) {
            console.error('Failed to save state:', err);
        }
    }

    function loadState() {
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) {
                return false;
            }

            const parsed = JSON.parse(raw);
            if (!parsed || !Array.isArray(parsed.tabs) || parsed.tabs.length === 0) {
                return false;
            }

            const seen = new Set();
            const loadedTabs = [];

            for (const item of parsed.tabs) {
                if (!item || typeof item.name !== 'string') {
                    continue;
                }

                const cleanedName = sanitizeName(item.name);
                if (!cleanedName) {
                    continue;
                }

                const key = cleanedName.toLowerCase();
                if (seen.has(key)) {
                    continue;
                }

                seen.add(key);
                const content = sanitizeScriptText(typeof item.content === 'string' ? item.content : '');
                const history = Array.isArray(item.history)
                    ? item.history
                        .filter(entry => typeof entry === 'string')
                        .map(entry => sanitizeScriptText(entry))
                    : [content];
                const safeHistory = history.length > 0 ? history : [content];
                const rawIndex = Number.isInteger(item.historyIndex) ? item.historyIndex : safeHistory.length - 1;
                const historyIndex = Math.max(0, Math.min(rawIndex, safeHistory.length - 1));

                loadedTabs.push({
                    id: typeof item.id === 'string' ? item.id : generateId(),
                    name: cleanedName,
                    content: safeHistory[historyIndex],
                    history: safeHistory,
                    historyIndex
                });
            }

            if (loadedTabs.length === 0) {
                return false;
            }

            tabs = loadedTabs;
            const exists = tabs.some(tab => tab.id === parsed.activeTabId);
            activeTabId = exists ? parsed.activeTabId : tabs[0].id;
            return true;
        } catch (err) {
            console.error('Failed to load state:', err);
            return false;
        }
    }

    function createDefaultState() {
        tabs = [{ id: generateId(), name: 'script1', content: '', history: [''], historyIndex: 0 }];
        activeTabId = tabs[0].id;
    }

    function getNextScriptName() {
        let index = 1;
        while (tabNameExists(`script${index}`)) {
            index += 1;
        }
        return `script${index}`;
    }

    function renderTabs() {
        tabsContainer.innerHTML = '';

        tabs.forEach(tab => {
            const tabBtn = document.createElement('button');
            tabBtn.type = 'button';
            tabBtn.className = `tab${tab.id === activeTabId ? ' active' : ''}`;
            tabBtn.innerHTML = `<i class="tab-icon vr-ic_fluent_tab_20_regular"></i><span class="tab-label"></span>`;
            tabBtn.querySelector('.tab-label').textContent = tab.name;
            tabBtn.dataset.tabId = tab.id;

            tabBtn.addEventListener('click', () => {
                switchTab(tab.id);
            });

            tabsContainer.appendChild(tabBtn);
        });
    }

    function switchTab(tabId) {
        if (!editor || tabId === activeTabId) {
            return;
        }

        clearTimeout(historyCheckpointTimer);
        commitActiveHistoryCheckpoint();

        activeTabId = tabId;
        const nextTab = tabs.find(tab => tab.id === tabId);
        setEditorValueSilently(nextTab ? nextTab.content : '');
        renderTabs();
        scheduleSave();
    }

    function createTabWithName(name) {
        if (editor) {
            clearTimeout(historyCheckpointTimer);
            commitActiveHistoryCheckpoint();
        }

        const newTab = {
            id: generateId(),
            name,
            content: '',
            history: [''],
            historyIndex: 0
        };

        tabs.push(newTab);
        activeTabId = newTab.id;

        if (editor) {
            setEditorValueSilently('');
        }

        renderTabs();
        scheduleSave();
    }

    function openTabModal(mode, tabId = null) {
        modalMode = mode;
        modalTabId = tabId;

        if (mode === 'rename') {
            const tab = tabs.find(t => t.id === tabId);
            if (!tab) {
                return;
            }
            modalTitle.textContent = 'Rename Tab';
            modalSubmitButton.innerHTML = '<i class="btn-icon vr-ic_fluent_rename_20_regular"></i><span>Rename</span>';
            modalInput.value = tab.name;
        } else {
            modalTitle.textContent = 'New Tab';
            modalSubmitButton.innerHTML = '<i class="btn-icon vr-ic_fluent_add_20_regular"></i><span>Create</span>';
            modalInput.value = getNextScriptName();
        }

        modalOverlay.style.display = 'flex';
        setTimeout(() => {
            modalInput.focus();
            modalInput.select();
        }, 0);
    }

    function closeTabModal() {
        modalOverlay.style.display = 'none';
        modalMode = null;
        modalTabId = null;
    }

    function submitTabModal() {
        const name = sanitizeName(modalInput.value);
        if (!name) {
            showToast('Tab name cannot be empty.');
            return;
        }
        if (name.length < 3) {
            showToast('Tab name must be at least 3 characters.');
            return;
        }

        if (modalMode === 'new') {
            if (tabNameExists(name)) {
                showToast('Tab name already exists.');
                return;
            }
            createTabWithName(name);
            closeTabModal();
            return;
        }

        if (modalMode !== 'rename') {
            return;
        }

        const tab = tabs.find(t => t.id === modalTabId);
        if (!tab) {
            closeTabModal();
            return;
        }

        if (name.toLowerCase() !== tab.name.toLowerCase() && tabNameExists(name, tab.id)) {
            showToast('Tab name already exists.');
            return;
        }

        if (name === tab.name) {
            closeTabModal();
            return;
        }

        tab.name = name;
        renderTabs();
        scheduleSave();
        closeTabModal();
    }

    function deleteTab(tabId) {
        if (tabs.length === 1) {
            showToast('At least one tab must stay.');
            return;
        }

        const index = tabs.findIndex(tab => tab.id === tabId);
        if (index === -1) {
            return;
        }

        clearTimeout(historyCheckpointTimer);
        commitActiveHistoryCheckpoint();

        const deletingActive = tabs[index].id === activeTabId;
        tabs.splice(index, 1);

        if (deletingActive) {
            const fallback = tabs[Math.max(0, index - 1)] || tabs[0];
            activeTabId = fallback.id;
            if (editor) {
                setEditorValueSilently(fallback.content);
            }
        }

        renderTabs();
        scheduleSave();
    }

                                [/[{}\[\]()]/, '@brackets'],
                                [/[;,.]/, 'delimiter'],
                                [/@symbols/, {
                                    cases: {
                                        '@operators': 'operator',
                                        '@default': 'operator'
                                    }
                                }]
                            ],
                            string_double: [
                                [/[^\\"]+/, 'string'],
                                [/@escapes/, 'string.escape'],
                                [/\\./, 'string.escape.invalid'],
                                [/"/, { token: 'string.quote', next: '@pop' }]
                            ],
                            string_single: [
                                [/[^\\']+/, 'string'],
                                [/@escapes/, 'string.escape'],
                                [/\\./, 'string.escape.invalid'],
                                [/'/, { token: 'string.quote', next: '@pop' }]
                            ],
                            string_block: [
                                [/\]\]/, { token: 'string', next: '@pop' }],
                                [/./, 'string']
                            ],
                            comment_block: [
                                [/\]\]/, { token: 'comment', next: '@pop' }],
                                [/./, 'comment']
                            ]
                        }
                    });

                    monaco.editor.defineTheme('custom-theme', {
                        base: 'vs-dark',
                        inherit: true,
                        rules: [
                            { token: 'keyword', foreground: 'ff8c00', fontStyle: 'bold' },
                            { token: 'constant', foreground: 'ffd27f', fontStyle: 'bold' },
                            { token: 'type.identifier', foreground: 'ffa95c' },
                            { token: 'predefined', foreground: 'ffbf73' },
                            { token: 'string', foreground: 'ffb366' },
                            { token: 'string.escape', foreground: 'ffd7a8' },
                            { token: 'number', foreground: 'ffc266' },
                            { token: 'number.float', foreground: 'ffc266' },
                            { token: 'number.hex', foreground: 'ffcf8d' },
                            { token: 'comment', foreground: '808080', fontStyle: 'italic' },
                            { token: 'operator', foreground: 'ffa040' },
                            { token: 'delimiter', foreground: 'f2dcc4' },
                            { token: 'delimiter.bracket', foreground: 'ffe6cc' }
                        ],
                        colors: {
                            'editor.background': '#060300',
                            'minimap.background': '#060300',
                            'editor.foreground': '#ffffff',
                            'editor.lineHighlightBackground': '#1a0d00',
                            'editor.lineNumbers': '#a0a0a0',
                            'editor.selectionBackground': '#2a1500',
                            'editorCursor.foreground': '#ff8c00',
                            'editorGutter.background': '#060300'
                        }
                    });

                    const luaKeywords = [
                        'and', 'break', 'do', 'else', 'elseif', 'end', 'for', 'function', 'goto', 'if', 'in',
                        'local', 'not', 'or', 'repeat', 'return', 'then', 'until', 'while', 'true', 'false', 'nil'
                    ];
                    const luaBuiltins = [
                        'assert', 'collectgarbage', 'dofile', 'error', 'getmetatable', 'ipairs', 'load', 'loadfile',
                        'next', 'pairs', 'pcall', 'print', 'rawequal', 'rawget', 'rawlen', 'rawset', 'require',
                        'select', 'setmetatable', 'tonumber', 'tostring', 'type', 'warn', 'xpcall'
                    ];
                    const luaTables = {
                        coroutine: ['close', 'create', 'isyieldable', 'resume', 'running', 'status', 'wrap', 'yield'],
                        io: ['close', 'flush', 'input', 'lines', 'open', 'output', 'popen', 'read', 'stderr', 'stdin', 'stdout', 'tmpfile', 'type', 'write'],
                        math: ['abs', 'acos', 'asin', 'atan', 'ceil', 'cos', 'deg', 'exp', 'floor', 'fmod', 'huge', 'log', 'max', 'maxinteger', 'min', 'mininteger', 'modf', 'pi', 'rad', 'random', 'randomseed', 'sin', 'sqrt', 'tan', 'tointeger', 'type', 'ult'],
                        os: ['clock', 'date', 'difftime', 'execute', 'exit', 'getenv', 'remove', 'rename', 'setlocale', 'time', 'tmpname'],
                        string: ['byte', 'char', 'dump', 'find', 'format', 'gmatch', 'gsub', 'len', 'lower', 'match', 'pack', 'packsize', 'rep', 'reverse', 'sub', 'unpack', 'upper'],
                        table: ['concat', 'insert', 'move', 'pack', 'remove', 'sort', 'unpack'],
                        utf8: ['char', 'charpattern', 'codepoint', 'codes', 'len', 'offset'],
                        debug: ['debug', 'gethook', 'getinfo', 'getlocal', 'getmetatable', 'getregistry', 'getupvalue', 'getuservalue', 'sethook', 'setlocal', 'setmetatable', 'setupvalue', 'setuservalue', 'traceback', 'upvalueid', 'upvaluejoin'],
                        package: ['config', 'cpath', 'loaded', 'path', 'preload', 'searchers', 'searchpath']
                    };
                    monaco.languages.registerCompletionItemProvider('lua', {
                        triggerCharacters: ['.', ':'],
                        provideCompletionItems: function (model, position) {
                            const word = model.getWordUntilPosition(position);
                            const range = {
                                startLineNumber: position.lineNumber,
                                endLineNumber: position.lineNumber,
                                startColumn: word.startColumn,
                                endColumn: word.endColumn
                            };
                            const suggestions = [];

                            luaKeywords.forEach((item) => {
                                suggestions.push({
                                    label: item,
                                    kind: monaco.languages.CompletionItemKind.Keyword,
                                    insertText: item,
                                    range
                                });
                            });
                            luaBuiltins.forEach((item) => {
                                suggestions.push({
                                    label: item,
                                    kind: monaco.languages.CompletionItemKind.Function,
                                    insertText: item,
                                    range
                                });
                            });
                            Object.keys(luaTables).forEach((tableName) => {
                                suggestions.push({
                                    label: tableName,
                                    kind: monaco.languages.CompletionItemKind.Module,
                                    insertText: tableName,
                                    range
                                });
                                luaTables[tableName].forEach((member) => {
                                    suggestions.push({
                                        label: `${tableName}.${member}`,
                                        kind: monaco.languages.CompletionItemKind.Method,
                                        insertText: `${tableName}.${member}`,
                                        range
                                    });
                                });
                            });

                            return { suggestions };
                        }
                    });

                    editor = monaco.editor.create(document.getElementById('monaco-editor'), {
                        value: '',
                        language: 'lua',
                        theme: 'custom-theme',
                        minimap: { enabled: false },
                        automaticLayout: true,
                        fontSize: 13,
                        contextmenu: false,
                        scrollBeyondLastLine: false,
                        renderLineHighlight: 'line',
                        cursorBlinking: 'solid',
                        cursorSmoothCaretAnimation: 'off',
                        smoothScrolling: false,
                        mouseWheelScrollSensitivity: 1,
                        fastScrollSensitivity: 1,
                        scrollbar: {
                            useShadows: false,
                            verticalScrollbarSize: 10,
                            horizontalScrollbarSize: 10
                        },
                        overviewRulerLanes: 0,
                        occurrencesHighlight: false,
                        selectionHighlight: false,
                        renderControlCharacters: false,
                        renderWhitespace: 'none'
                    });

                    editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyZ, () => {
                        undoActiveTab();
                    });
                    editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyY, () => {
                        redoActiveTab();
                    });
                    editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyMod.Shift | monaco.KeyCode.KeyZ, () => {
                        redoActiveTab();
                    });

                    const initialTab = tabs.find(tab => tab.id === activeTabId) || tabs[0];
                    if (initialTab) {
                        activeTabId = initialTab.id;
                        setEditorValueSilently(initialTab.content);
                    }

                    renderTabs();

                    editor.onDidChangeModelContent(() => {
                        if (isApplyingHistory) {
                            return;
                        }

                        const activeTab = getActiveTab();
                        if (!activeTab || !editor) {
                            return;
                        }

                        activeTab.content = sanitizeScriptText(editor.getValue());
                        scheduleHistoryCheckpoint();
                        scheduleSave();
                    });

                    window.addEventListener('beforeunload', () => {
                        saveAllTabsImmediately();
                    });
                    window.addEventListener('pagehide', () => {
                        saveAllTabsImmediately();
                    });
                    document.addEventListener('visibilitychange', () => {
                        if (document.visibilityState === 'hidden') {
                            saveAllTabsImmediately();
                        }
                    });

                    autoSaveIntervalTimer = setInterval(() => {
                        if (!editor || document.visibilityState === 'hidden') {
                            return;
                        }
                        flushEditorState();
                    }, AUTO_SAVE_INTERVAL_MS);
                } catch (err) {
                    console.error('Monaco Editor initialization failed:', err);
                }
            });
        } catch (err) {
            console.error('Require.js not loaded:', err);
        }
    }

    document.addEventListener('click', (event) => {
        if (!contextMenu.contains(event.target)) {
            hideContextMenu();
        }
        if (!editorContextMenu.contains(event.target)) {
            hideEditorContextMenu();
        }
    });

    document.addEventListener('contextmenu', (event) => {
        event.preventDefault();
        const tabElement = event.target.closest('.tab');
        if (tabElement && tabElement.dataset.tabId) {
            hideEditorContextMenu();
            showContextMenu(event.clientX, event.clientY, tabElement.dataset.tabId);
            return;
        }

        if (event.target.closest('#monaco-editor')) {
            hideContextMenu();
            showEditorContextMenu(event.clientX, event.clientY);
            return;
        }

        hideContextMenu();
        hideEditorContextMenu();
    });

    document.addEventListener('keydown', (event) => {
        const key = event.key.toLowerCase();
        const hasCommand = event.ctrlKey || event.metaKey;

        if (key === 'f5' || (hasCommand && key === 'r')) {
            event.preventDefault();
            saveAllTabsImmediately();
            setTimeout(() => {
                location.reload();
            }, 0);
            return;
        }

        if (!editor) {
            return;
        }

        const target = event.target;
        const isInput = target instanceof HTMLInputElement || target instanceof HTMLTextAreaElement || target.isContentEditable;
        const insideEditor = target instanceof Node && editorHost.contains(target);
        if (isInput && !insideEditor) {
            return;
        }

        if (!hasCommand) {
            return;
        }

        if (key === 'z' && event.shiftKey) {
            event.preventDefault();
            redoActiveTab();
            return;
        }

        if (key === 'z') {
            event.preventDefault();
            undoActiveTab();
            return;
        }

        if (key === 'y') {
            event.preventDefault();
            redoActiveTab();
        }
    });

    renameTabButton.addEventListener('click', () => {
        if (contextTabId) {
            openTabModal('rename', contextTabId);
        }
        hideContextMenu();
    });

    deleteTabButton.addEventListener('click', () => {
        if (contextTabId) {
            deleteTab(contextTabId);
        }
        hideContextMenu();
    });

    executeTabButton.addEventListener('click', () => {
        executeActiveTabScript();
        hideEditorContextMenu();
    });

    clearTabButton.addEventListener('click', () => {
        clearActiveTabContent();
        hideEditorContextMenu();
    });

    attachTabButton.addEventListener('click', () => {
        runAttach();
        hideEditorContextMenu();
    });

    addTabButton.addEventListener('click', () => {
        hideContextMenu();
        hideEditorContextMenu();
        openTabModal('new');
    });

    openScriptHubButton.addEventListener('click', () => {
        hideContextMenu();
        hideEditorContextMenu();
        toggleScriptHub();
    });

    resizeHandles.forEach((handle) => {
        handle.addEventListener('mousedown', (event) => {
            if (event.button !== 0) {
                return;
            }
            event.preventDefault();
            event.stopPropagation();
            startHostResize(handle.dataset.resizeDir);
        });
    });


    scriptHubLoadButton.addEventListener('click', () => {
        loadAllScripts();
    });
    scriptHubMoreButton.addEventListener('click', () => {
        loadMoreScripts();
    });

    scriptHubSearch.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
            loadAllScripts();
        }
    });

    scriptHubResizer.addEventListener('mousedown', (event) => {
        event.preventDefault();
        isResizingScriptHub = true;
        scriptHubResizeStartX = event.clientX;
        scriptHubResizeStartWidth = scriptHubPanel.getBoundingClientRect().width;
        document.body.style.cursor = 'ew-resize';
    });

    document.addEventListener('mousemove', (event) => {
        if (!isResizingScriptHub) {
            return;
        }

        const delta = scriptHubResizeStartX - event.clientX;
        setScriptHubWidth(scriptHubResizeStartWidth + delta);
    });

    document.addEventListener('mouseup', () => {
        if (!isResizingScriptHub) {
            return;
        }
        isResizingScriptHub = false;
        document.body.style.cursor = '';
    });

    window.addEventListener('resize', () => {
        const ratioRaw = Number(localStorage.getItem(SCRIPT_HUB_WIDTH_RATIO_KEY));
        if (Number.isFinite(ratioRaw) && ratioRaw > 0) {
            setScriptHubWidth(window.innerWidth * ratioRaw, false);
            return;
        }

        const width = scriptHubPanel.getBoundingClientRect().width || getScriptHubDefaultWidth();
        setScriptHubWidth(width, false);
    });

    tabsContainer.addEventListener('wheel', (event) => {
        const hasHorizontalDelta = Math.abs(event.deltaX) > 0;
        const delta = hasHorizontalDelta ? event.deltaX : event.deltaY;
        if (delta === 0) {
            return;
        }

        event.preventDefault();
        tabsContainer.scrollLeft += delta;
    }, { passive: false });

    modalSubmitButton.addEventListener('click', submitTabModal);
    modalCancelButton.addEventListener('click', closeTabModal);
    modalOverlay.addEventListener('click', (event) => {
        if (event.target === modalOverlay) {
            closeTabModal();
        }
    });
    modalInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
            submitTabModal();
        }
        if (event.key === 'Escape') {
            closeTabModal();
        }
    });

    closeWindowButton.addEventListener('click', () => {
        saveAllTabsImmediately();
    });
    maxWindowButton.addEventListener('click', () => {});
    minWindowButton.addEventListener('click', () => {});

    if (window.chrome && window.chrome.webview) {
        window.chrome.webview.addEventListener('message', (event) => {
            handleHostMessage(event.data);
        });
    }

    if (!loadState()) {
        createDefaultState();
    }

    initializeScriptHubWidth();
    setWindowAttachStatus('NotAttached');
    sendHostCommand('status');
    if (window.chrome && window.chrome.webview) {
        statusPollTimer = setInterval(() => {
            sendHostCommand('status');
        }, 50);
    }
    window.addEventListener('beforeunload', () => {
        if (statusPollTimer) {
            clearInterval(statusPollTimer);
            statusPollTimer = null;
        }
        if (autoSaveIntervalTimer) {
            clearInterval(autoSaveIntervalTimer);
            autoSaveIntervalTimer = null;
        }
    });
    renderTabs();
    initializeMonacoEditor();
</script>
</body>
</html>
